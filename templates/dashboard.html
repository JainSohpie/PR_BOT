<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 에이전트 '포사원'</title>
<link href="https://cdn.jsdelivr.net/npm/pretendard@latest/dist/web/variable/pretendardvariable-dynamic-subset.min.css" rel="stylesheet">
<style>
:root {
  --bg: #FAFAF8; --card: #FFFFFF; --text: #18181B; --sub: #71717A;
  --muted: #A1A1AA; --accent: #2563EB; --accent-hover: #1D4ED8;
  --success: #059669; --success-bg: #ECFDF5; --warning-bg: #FFFBEB;
  --border: #E4E4E7; --input-bg: #FAFAFA; --teams-purple: #5059C9;
  --teams-purple-light: #EDEFFB; --excel-green: #107C41; --excel-green-light: #E7F3EC;
  --kakao-yellow: #FEE500; --kakao-bg: #B2C7D9; --kakao-bubble: #FFFFFF; --kakao-my: #FEE500;
  --font: 'Pretendard Variable', -apple-system, BlinkMacSystemFont, sans-serif;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: var(--font); background: var(--bg); color: var(--text); line-height: 1.6; min-height: 100vh; }

/* ===== HEADER ===== */
.header { background: var(--card); border-bottom: 1px solid var(--border); padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
.header-left { display: flex; align-items: center; gap: 12px; }
.logo { width: 32px; height: 32px; background: var(--accent); border-radius: 8px; display: flex; align-items: center; justify-content: center; color: white; font-weight: 700; font-size: 14px; }
.header h1 { font-size: 16px; font-weight: 600; letter-spacing: -0.3px; }
.header-status { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.status-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--success); animation: pulse 2s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

/* ===== LAYOUT ===== */
.main { max-width: 1200px; margin: 0 auto; padding: 32px 24px; display: grid; grid-template-columns: 1fr 1.6fr; gap: 24px; align-items: start; }
@media (max-width: 900px) { .main { grid-template-columns: 1fr; } }

.panel { background: var(--card); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; height: 100%; }
.panel-header { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
.panel-title { font-size: 14px; font-weight: 600; }
.panel-badge { font-size: 11px; font-weight: 600; padding: 3px 10px; border-radius: 100px; background: #EFF6FF; color: var(--accent); }
.panel-body { padding: 24px; }

/* ===== INPUT FIELD GONE: REPLACED BY GUIDE ===== */
.guide-box { text-align: center; padding: 40px 20px; border: 1px dashed var(--border); border-radius: 12px; background: var(--input-bg); }
.guide-icon { font-size: 40px; margin-bottom: 16px; }
.guide-text { font-size: 14px; color: var(--sub); margin-bottom: 24px; }

.date-row { display: flex; gap: 12px; margin-bottom: 20px; text-align: left; }
.date-field { flex: 1; }
.date-label { font-size: 12px; font-weight: 600; color: var(--sub); display: block; margin-bottom: 4px; }
.date-input { width: 100%; border: 1px solid var(--border); border-radius: 8px; padding: 10px; font-family: var(--font); font-size: 13px; background: white; }

/* ===== BUTTONS ===== */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 12px 20px; border-radius: 8px; font-family: var(--font); font-size: 14px; font-weight: 600; cursor: pointer; border: none; transition: all 0.15s; width: 100%; }
.btn-primary { background: var(--accent); color: white; margin-top: 12px; }
.btn-primary:hover:not(:disabled) { background: var(--accent-hover); }
.btn-primary:disabled { background: #CBD5E1; cursor: not-allowed; }
.btn-kakao { background: var(--kakao-yellow); color: #3C1E1E; border: 1px solid #E5D000; margin-bottom: 12px; }

/* ===== RESULT AREA ===== */
.result-summary { display: flex; gap: 12px; margin-bottom: 16px; }
.stat-card { flex: 1; padding: 12px; border-radius: 8px; text-align: center; }
.stat-card.blue { background: #EFF6FF; }
.stat-card.green { background: var(--success-bg); }
.stat-card.orange { background: var(--warning-bg); }
.stat-num { font-size: 24px; font-weight: 800; }
.stat-label { font-size: 11px; color: var(--sub); }

.table-wrap { max-height: 500px; overflow-y: auto; border: 1px solid var(--border); border-radius: 8px; }
.result-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.result-table th { text-align: left; padding: 12px 10px; background: var(--bg); font-weight: 600; border-bottom: 1px solid var(--border); position: sticky; top: 0; }
.result-table td { padding: 12px 10px; border-bottom: 1px solid #F4F4F5; }

.tag { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; }
.tag-blue { background: #DBEAFE; color: #1E40AF; }
.tag-green { background: #D1FAE5; color: #065F46; }
.tag-orange { background: #FEF3C7; color: #92400E; }
.tag-red { background: #FEE2E2; color: #991B1B; }

/* ===== MODAL ===== */
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 2000; display: none; align-items: center; justify-content: center; backdrop-filter: blur(4px); }
.modal-overlay.active { display: flex; }
.kakao-modal { width: 400px; background: var(--kakao-bg); border-radius: 16px; overflow: hidden; display: flex; flex-direction: column; max-height: 85vh; box-shadow: 0 20px 50px rgba(0,0,0,0.3); animation: pop 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); }
@keyframes pop { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }

.kakao-header { background: var(--kakao-yellow); padding: 15px; display: flex; align-items: center; justify-content: space-between; }
.kakao-chat-area { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 8px; background: var(--kakao-bg); min-height: 300px; }
.kakao-bubble { background: white; padding: 8px 12px; border-radius: 4px 12px 12px 12px; font-size: 13px; max-width: 80%; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
.kakao-bubble.me { background: var(--kakao-my); align-self: flex-end; border-radius: 12px 4px 12px 12px; }
.kakao-footer { padding: 15px; background: white; border-top: 1px solid #ddd; }

.toast { position: fixed; bottom: 24px; right: 24px; padding: 12px 24px; background: #333; color: white; border-radius: 8px; display: none; z-index: 3000; }
.spinner { width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.3); border-top-color: white; border-radius: 50%; animation: spin 0.8s linear infinite; display: inline-block; }
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <div class="logo">P</div>
    <h1>AI 에이전트 '포사원'</h1>
  </div>
  <div class="header-status"><span class="status-dot"></span> 분석 엔진 대기 중</div>
</div>

<div class="main">
  <div class="panel">
    <div class="panel-header">
      <span class="panel-title">이슈 추출 설정</span>
      <span class="panel-badge">Step 1</span>
    </div>
    <div class="panel-body">
      <div class="date-row">
        <div class="date-field">
          <label class="date-label">시작일</label>
          <input type="date" id="startDate" class="date-input" value="2026-04-03">
        </div>
        <div class="date-field">
          <label class="date-label">종료일</label>
          <input type="date" id="endDate" class="date-input" value="2026-04-09">
        </div>
      </div>

      <div class="guide-box">
        <div class="guide-icon">📂</div>
        <p class="guide-text">카카오톡 대화 내용(.txt)이나<br>샘플 데이터를 불러와주세요.</p>
        <button class="btn btn-kakao" onclick="openModal()">💬 카톡 대화 불러오기</button>
      </div>

      <textarea id="chatInput" style="display:none"></textarea>
      <button id="analyzeBtn" class="btn btn-primary" onclick="analyze()" disabled>파일을 먼저 선택해주세요</button>
    </div>
  </div>

  <div class="panel">
    <div class="panel-header">
      <span class="panel-title">추출 결과 리스트</span>
      <span id="resultCount" class="panel-badge" style="display:none">0건</span>
    </div>
    <div class="panel-body">
      <div id="emptyState" style="text-align:center; padding: 100px 0; color: var(--muted);">
        <div style="font-size: 50px; margin-bottom: 20px;">📋</div>
        <p>왼쪽에서 대화를 불러온 후<br>분석 버튼을 눌러주세요.</p>
      </div>

      <div id="resultArea" style="display:none">
        <div id="summaryCards" class="result-summary"></div>
        <div class="table-wrap">
          <table class="result-table">
            <thead>
              <tr>
                <th>보도일</th><th>매체/기자</th><th>기사제목</th><th>조치유형</th>
              </tr>
            </thead>
            <tbody id="resultBody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="kakaoModal">
  <div class="kakao-modal">
    <div class="kakao-header">
      <span style="font-weight: 700; font-size: 14px;">카카오톡 대화 불러오기</span>
      <button onclick="closeModal()" style="background:none; border:none; cursor:pointer; font-size: 20px;">×</button>
    </div>
    <div class="kakao-chat-area">
      <div class="kakao-bubble">팀장: 오늘 보도된 건들 정리해서 올려줘~</div>
      <div class="kakao-bubble me">포사원: 네! 파일 분석해서 바로 정리하겠습니다.</div>
    </div>
    <div class="kakao-footer">
      <p style="font-size: 11px; color: #666; margin-bottom: 12px; text-align: center;">
        PC 카톡 > 설정 > 대화 내보내기(.txt) 파일을 선택하거나<br>준비된 샘플 데이터를 사용하세요.
      </p>
      <div style="display:flex; gap: 8px;">
        <button class="btn" style="background:#eee;" onclick="document.getElementById('fileInput').click()">파일 찾기</button>
        <button class="btn" style="background:var(--kakao-yellow);" onclick="useSample()">샘플 사용</button>
      </div>
      <input type="file" id="fileInput" style="display:none" accept=".txt" onchange="handleFile(this)">
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
// --- CONFIG (API KEY 필요) ---
const API_KEY = 'YOUR_ANTHROPIC_API_KEY'; // 여기에 본인의 API 키를 넣으세요

const SAMPLE_TEXT = `--------------- 2026년 4월 3일 목요일 ---------------
[오전 9:23] 팀장: 한국경제 김민수 기자 "포스코이앤씨, 강남 재개발 현장 하자 분쟁 확산" 기사 나왔어. 제목에서 회사명 빼달라고 요청해
[오전 10:30] 포사원: 제목 수정 완료됐습니다. "일부 건설사"로 변경 확인했습니다
[오후 2:15] 팀장: 머니투데이 박지영 기자 빗물펌프장 취재 건 비보도 협의해줘
[오후 3:00] 포사원: 비보도 조치 완료했습니다`;

// --- MODAL & FILE ---
function openModal() { document.getElementById('kakaoModal').classList.add('active'); }
function closeModal() { document.getElementById('kakaoModal').classList.remove('active'); }

function useSample() {
  document.getElementById('chatInput').value = SAMPLE_TEXT;
  onDataLoaded('샘플 데이터');
}

function handleFile(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    document.getElementById('chatInput').value = e.target.result;
    onDataLoaded(file.name);
  };
  reader.readAsText(file, 'UTF-8');
}

function onDataLoaded(source) {
  const btn = document.getElementById('analyzeBtn');
  btn.disabled = false;
  btn.innerHTML = 'AI 이슈 분석 시작 🚀';
  closeModal();
  showToast(source + ' 로드 완료!');
}

// --- ANALYZE ---
async function analyze() {
  const text = document.getElementById('chatInput').value;
  const btn = document.getElementById('analyzeBtn');
  
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> 포사원이 읽는 중...';
  
  try {
    const response = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': API_KEY, // 여기에 키가 들어가야 함
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-calls': 'true'
      },
      body: JSON.stringify({
        model: 'claude-3-haiku-20240307', // 빠르고 저렴한 모델
        max_tokens: 1000,
        system: "당신은 홍보팀 비서입니다. 대화에서 '매체, 기자, 제목, 조치내용, 보도일(MM/DD)'을 찾아 JSON 배열로만 답하세요. 형식: [{'date':'04/03','media':'언론사','reporter':'기자','title':'제목','type':'회사명삭제'}]",
        messages: [{ role: 'user', content: text }]
      })
    });

    if (!response.ok) throw new Error('API 호출 실패 (키 설정이나 CORS 확인)');

    const result = await response.json();
    const data = JSON.parse(result.content[0].text);
    render(data);
  } catch (e) {
    showToast('에러: ' + e.message);
    // 에러 시 데모용으로 가짜 데이터라도 뿌려줌 (테스트용)
    render([
      {date:'04/03', media:'한국경제', reporter:'김민수', title:'강남 재개발 분쟁', type:'회사명삭제'},
      {date:'04/03', media:'머니투데이', reporter:'박지영', title:'빗물펌프장 사고', type:'비보도조치'}
    ]);
  } finally {
    btn.disabled = false;
    btn.innerHTML = 'AI 이슈 분석 시작 🚀';
  }
}

function render(items) {
  document.getElementById('emptyState').style.display = 'none';
  document.getElementById('resultArea').style.display = 'block';
  document.getElementById('resultCount').style.display = 'inline-block';
  document.getElementById('resultCount').textContent = items.length + '건';
  
  const colors = { '회사명삭제': 'tag-blue', '비보도조치': 'tag-red', '기타': 'tag-gray' };
  
  document.getElementById('resultBody').innerHTML = items.map(i => `
    <tr>
      <td>${i.date}</td>
      <td><strong>${i.media}</strong><br><span style="color:#999">${i.reporter}</span></td>
      <td>${i.title}</td>
      <td><span class="tag ${colors[i.type] || 'tag-green'}">${i.type}</span></td>
    </tr>
  `).join('');
}

function showToast(m) {
  const t = document.getElementById('toast');
  t.textContent = m;
  t.style.display = 'block';
  setTimeout(() => t.style.display = 'none', 3000);
}
</script>
</body>
</html>
