<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 에이전트 '포사원'</title>
    <link href="https://cdn.jsdelivr.net/npm/pretendard@latest/dist/web/variable/pretendardvariable-dynamic-subset.min.css" rel="stylesheet">
    <style>
        :root {
            --kakao-yellow: #FEE500;
            --kakao-brown: #3C1E1E;
            --posco-blue: #004587;
        }
        body {
            font-family: 'Pretendard Variable', sans-serif;
            background-color: #f5f6f7;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 800px;
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
        h1 { color: var(--posco-blue); font-size: 24px; margin-bottom: 20px; }
        
        textarea {
            width: 100%;
            height: 200px;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 12px;
            box-sizing: border-box;
            font-size: 14px;
            resize: none;
            margin-bottom: 10px;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        button {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
        }

        .btn-kakao { background-color: var(--kakao-yellow); color: var(--kakao-brown); }
        .btn-analyze { background-color: var(--posco-blue); color: white; flex-grow: 1; }
        button:hover { opacity: 0.9; transform: translateY(-1px); }

        /* 카톡 팝업 스타일 */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: #abc1d1; /* 카톡 배경색 */
            width: 350px;
            height: 500px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .modal-header {
            background: #abc1d1;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
        }
        .chat-body {
            flex-grow: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .message {
            background: white;
            padding: 8px 12px;
            border-radius: 8px;
            max-width: 80%;
            font-size: 13px;
            position: relative;
        }
        .message.mine {
            align-self: flex-end;
            background: var(--kakao-yellow);
        }
        .modal-footer {
            padding: 15px;
            background: white;
            text-align: center;
        }

        /* 결과 테이블 */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            padding: 12px;
            border-bottom: 1px solid #eee;
            text-align: left;
            font-size: 14px;
        }
        th { background-color: #f8f9fa; color: #555; }
    </style>
</head>
<body>

<div class="container">
    <h1>🚀 홍사원의 AI 리포트 분석</h1>
    
    <textarea id="inputText" placeholder="분석할 대화 내용이나 텍스트를 입력하세요..."></textarea>
    
    <div class="btn-group">
        <button class="btn-kakao" onclick="openKakao()">💬 카톡 대화 불러오기</button>
        <button class="btn-analyze" onclick="startAnalysis()">AI 분석 시작 ✨</button>
    </div>

    <div id="resultArea">
        <table id="resultTable" style="display:none;">
            <thead>
                <tr>
                    <th>보도일</th>
                    <th>매체명</th>
                    <th>기사 제목</th>
                    <th>조치 유형</th>
                    <th>조치 내용</th>
                </tr>
            </thead>
            <tbody id="resultBody"></tbody>
        </table>
    </div>
</div>

<div id="kakaoModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <span>채팅방 대화</span>
            <span style="cursor:pointer" onclick="closeModal()">✕</span>
        </div>
        <div class="chat-body">
            <div class="message">주간 보도 실적 공유드립니다.</div>
            <div class="message mine">네, 이번 주 비보도 조치 건 위주로 정리해볼게요.</div>
            <div class="message">오티에르 반포 관련해서 한국경제 기사 하나 떴던데 확인 부탁드려요.</div>
            <div class="message mine">방금 매니저님께 연락해서 기사 제목 '오티에르 반포, 럭셔리의 정점'으로 수정 요청했고, 오보 부분은 삭제하기로 했습니다.</div>
            <div class="message">고생하셨습니다!</div>
        </div>
        <div class="modal-footer">
            <button class="btn-kakao" style="width:100%" onclick="extractChat()">대화 내용 추출하기</button>
        </div>
    </div>
</div>

<script>
    function openKakao() {
        document.getElementById('kakaoModal').style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('kakaoModal').style.display = 'none';
    }

    function extractChat() {
        const sampleChat = `[김팀장] [오후 5:00] 주간 보도 실적 공유드립니다.\n[나] [오후 5:01] 네, 이번 주 비보도 조치 건 위주로 정리해볼게요.\n[김팀장] [오후 5:02] 오티에르 반포 관련해서 한국경제 기사 하나 떴던데 확인 부탁드려요.\n[나] [오후 5:05] 방금 매니저님께 연락해서 기사 제목 '오티에르 반포, 럭셔리의 정점'으로 수정 요청했고, 오보 부분은 삭제하기로 했습니다.`;
        document.getElementById('inputText').value = sampleChat;
        closeModal();
    }

        const text = document.getElementById('inputText').value;
        if(!text) return alert("내용을 입력해주세요!");

        const btn = document.querySelector('.btn-analyze');
        btn.innerText = "분석 중... ⏳";
