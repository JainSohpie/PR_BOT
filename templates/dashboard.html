<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>포사원 시뮬레이션</title>
    <link href="https://cdn.jsdelivr.net/npm/pretendard@latest/dist/web/variable/pretendardvariable-dynamic-subset.min.css" rel="stylesheet">
    <style>
        :root {
            --kakao-yellow: #FEE500;
            --kakao-bg: #BACEE0;
            --my-bubble: #FEE500;
            --other-bubble: #FFFFFF;
            --text-main: #191919;
            --text-sub: #707070;
            --accent: #2563EB;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard Variable', sans-serif; }
        body { background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; height: 100vh; }

        /* 팝업 컨테이너 */
        .popup-card {
            width: 400px;
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2);
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        /* 헤더 영역 */
        .popup-header {
            padding: 20px;
            background: white;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header-title { font-weight: 700; font-size: 16px; color: var(--text-main); }
        .close-btn { cursor: pointer; border: none; background: none; font-size: 20px; color: #ccc; }

        /* 카카오톡 채팅창 영역 */
        .chat-container {
            height: 450px;
            background: var(--kakao-bg);
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .date-divider {
            text-align: center;
            font-size: 11px;
            color: white;
            background: rgba(0,0,0,0.1);
            padding: 4px 12px;
            border-radius: 12px;
            width: fit-content;
            margin: 10px auto;
        }

        /* 말풍선 공통 */
        .message { display: flex; gap: 8px; max-width: 85%; opacity: 0; transform: translateY(10px); }
        .message.show { animation: slideUp 0.3s forwards; }
        
        @keyframes slideUp {
            to { opacity: 1; transform: translateY(0); }
        }

        .profile-img { width: 35px; height: 35px; border-radius: 14px; background: #ddd; flex-shrink: 0; }
        .msg-content { display: flex; flex-direction: column; gap: 4px; }
        .sender-name { font-size: 12px; color: var(--text-sub); }
        .bubble { 
            padding: 8px 12px; 
            border-radius: 12px; 
            font-size: 13px; 
            line-height: 1.5; 
            position: relative;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }

        /* 상대방 메시지 */
        .message.other { align-self: flex-start; }
        .other .bubble { background: var(--other-bubble); border-top-left-radius: 2px; }

        /* 내 메시지 */
        .message.me { align-self: flex-end; flex-direction: row-reverse; }
        .me .bubble { background: var(--my-bubble); border-top-right-radius: 2px; }
        .me .sender-name { text-align: right; }

        /* 하단 액션 영역 */
        .popup-footer {
            padding: 20px;
            background: #f9fafb;
            border-top: 1px solid #eee;
        }

        .action-info {
            background: white;
            border: 1px solid var(--accent);
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 15px;
            display: none;
        }
        .action-info.active { display: block; animation: fadeIn 0.5s; }

        .ai-badge {
            background: var(--accent);
            color: white;
            font-size: 10px;
            font-weight: 800;
            padding: 2px 6px;
            border-radius: 4px;
            margin-bottom: 5px;
            display: inline-block;
        }
        .info-text { font-size: 12px; color: var(--text-main); font-weight: 600; }

        .start-btn {
            width: 100%;
            padding: 14px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
        }
        .start-btn:hover { background: #1d4ed8; }
        .start-btn:disabled { background: #93c5fd; cursor: not-allowed; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

<div class="popup-card">
    <div class="popup-header">
        <span class="header-title">업무 시뮬레이션: 홍보팀</span>
        <button class="close-btn">&times;</button>
    </div>

    <div class="chat-container" id="chatBox">
        <div class="date-divider">2026년 4월 3일 목요일</div>
        </div>

    <div class="popup-footer">
        <div id="aiAnalysis" class="action-info">
            <span class="ai-badge">AI AGENT 분석 중</span>
            <div class="info-text" id="aiStatus">실시간 이슈 감지 및 데이터베이스 분류 중...</div>
        </div>
        <button id="runBtn" class="start-btn" onclick="startSimulation()">시뮬레이션 시작</button>
    </div>
</div>

<script>
    const messages = [
        { type: 'other', name: '팀장', text: '한국경제 김민수 기자 "포스코이앤씨 하자 분쟁 확산" 기사 나왔어. 제목에서 회사명 빼달라고 요청해' },
        { type: 'me', name: '이자인 사원', text: '확인했습니다. 기자한테 연락드렸습니다' },
        { type: 'me', name: '이자인 사원', text: '제목 수정 완료됐습니다. "포스코이앤씨" → "일부 건설사"로 변경' },
        { type: 'other', name: '팀장', text: '머니투데이 박지영 기자한테서 빗물펌프장 안전사고 취재 문의 왔어' },
        { type: 'me', name: '이자인 사원', text: '통화해서 상황 설명드렸고, 보도 안 하기로 했습니다. 비보도 조치 완료' }
    ];

    const aiSteps = [
        "이슈 키워드 추출: #하자분쟁 #한국경제",
        "조치 유형 분류: [제목 및 내용수정]",
        "이슈 키워드 추출: #안전사고 #취재문의",
        "조치 유형 분류: [비보도조치]",
        "Teams DB 전송 준비 완료 ✅"
    ];

    async function startSimulation() {
        const runBtn = document.getElementById('runBtn');
        const chatBox = document.getElementById('chatBox');
        const aiAnalysis = document.getElementById('aiAnalysis');
        const aiStatus = document.getElementById('aiStatus');

        runBtn.disabled = true;
        runBtn.innerText = "분석 진행 중...";
        aiAnalysis.classList.add('active');

        for (let i = 0; i < messages.length; i++) {
            // 메시지 추가
            const msg = messages[i];
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${msg.type}`;
            
            msgDiv.innerHTML = `
                <div class="profile-img"></div>
                <div class="msg-content">
                    <span class="sender-name">${msg.name}</span>
                    <div class="bubble">${msg.text}</div>
                </div>
            `;
            
            chatBox.appendChild(msgDiv);
            
            // 애니메이션 트리거
            setTimeout(() => msgDiv.classList.add('show'), 50);
            
            // AI 분석 상태 업데이트 (중간중간)
            if(i % 2 === 0) {
                aiStatus.innerText = aiSteps[Math.floor(i/1.2)];
            }

            chatBox.scrollTop = chatBox.scrollHeight;
            await new Promise(r => setTimeout(r, 1200)); // 대화 간격
        }

        aiStatus.innerText = aiSteps[aiSteps.length - 1];
        aiStatus.style.color = "#059669";
        runBtn.innerText = "Teams에 저장됨";
        
        // 성공 토스트나 추가 액션
        setTimeout(() => {
            alert("홍사원이 카톡 대화를 분석하여 Teams 엑셀에 기록을 완료했습니다!");
        }, 500);
    }
</script>

</body>
</html>
